name: Verify recovered research record

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Validate recovered result record
        run: python scripts/verify_recovered_results.py
      - name: Run tests
        run: pytest -q
      - name: Re-render recovered figures
        run: python scripts/render_recovered_figures.py
      - name: Ensure rendering is reproducible
        run: git diff --exit-code -- results/figures/
