[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minos-j"
version = "0.1.0"
description = "Reference contracts and reproducibility utilities for the Minos-J falsification research project"
requires-python = ">=3.10"
authors = [{name = "Susan"}]
readme = "README.md"
license = {text = "Research prototype"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
